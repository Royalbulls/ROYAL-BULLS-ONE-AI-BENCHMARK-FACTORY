[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "royal-bulls-one-benchmark-factory"
version = "0.1.0"
description = "Prototype AI coding benchmark task factory"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "openai>=1.68,<3.0"]

[tool.setuptools.packages.find]
include = ["benchmark_factory*"]
